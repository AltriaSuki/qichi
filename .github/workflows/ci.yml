# 推送后自动测试：共享模块、服务端（Testcontainers 起 PostgreSQL，GitHub 的机器自带 Docker）、Android 单元测试和 lint。
# 不部署、不发布；部署仍然按 docs/07-deploy.md 经人类同意后手动做。
name: 测试

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: 共享模块
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon
        working-directory: shared

  server:
    name: 服务端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon
        working-directory: server
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: server-test-reports, path: server/build/reports/tests }

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # 版本号按提交次数算，要完整历史
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon
        working-directory: android
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests
            android/app/build/reports/lint-results-debug.html
