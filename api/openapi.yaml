openapi: 3.1.0
info:
  title: 栖迟 Qichi API
  version: 0.1.0
  summary: 第 1–3 阶段接口契约（账号、房间、同步、心情、待办、日程、聊天、文件、回收站、推送设备）
  description: |
    这是接口的**唯一契约来源**。约定与全貌见 `docs/04-api.md`，同步机制见 `docs/05-sync-offline.md`。
    改接口的顺序：先改本文件 → 再改 `shared/` 的数据类 → 再改服务端与客户端。

    通用约定：
    - JSON，UTF-8，字段名 camelCase；时间 ISO-8601 UTC（`2026-09-21T11:30:00Z`）；纯日期 `2026-09-21`。
    - 枚举值是英文小写字符串（多个单词用下划线，如 `mood_response`）。
    - 请求头 `X-Qichi-Client: android/{versionName}`，便于排查。
    - 房间内资源都在 `/rooms/{roomId}/…` 下；不是该房间成员一律返回 **404**。
    - 创建：请求体带客户端生成的 `id`（UUIDv7）；新建返回 **201**，同 id 已存在返回 **200** 与已有对象；
      同 id 属于别人或别的房间返回 **409** `conflict_id`。
    - 修改：`PATCH` 只发改动的字段；字段显式传 `null` 表示清空；返回完整对象。
    - 删除：`DELETE` = 软删除（进回收站），返回带 `deletedAt` 的完整对象；彻底删除走回收站接口。
    - 所有写入都会让房间的 `seq` 加一，并通过 WebSocket 广播 `changed`。
    - 错误一律 `application/problem+json`，客户端按 `code` 判断。
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: qichi.example.com
  - url: http://localhost:8080/api/v1
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: system
    description: 系统
  - name: auth
    description: 注册、登录、令牌（P1）
  - name: me
    description: 当前用户（P1）
  - name: rooms
    description: 房间、成员、邀请（P1）
  - name: sync
    description: 首次快照、增量同步、实时通道（P1）
  - name: moods
    description: 心情与回应（P2）
  - name: todos
    description: 待办（P2）
  - name: events
    description: 日程（P2）
  - name: calendar
    description: ICS 导入、导出与只读订阅（P4）
  - name: messages
    description: 聊天、未读位置（P3）
  - name: files
    description: 文件上传、下载、缩略图（P3）
  - name: trash
    description: 回收站（P3）
  - name: devices
    description: 推送设备（P3）
  - name: ideas
    description: 灵感（P4）
  - name: documents
    description: 共同写作：文稿与不可变版本（P5）
  - name: summaries
    description: 总结与年度回顾（AI 派生，带来源回链）（P6）
  - name: reviews
    description: 审稿：不可变版本、安全预览（按页图片 + 文字层）、批注与提议、讨论、版本差异（P7）
  - name: reading
    description: 阅读：书架、各自进度、书签 / 标注 / 摘录、共同可见的感想、共读计划（P6）
  - name: timeline
    description: 共同时间线：按月回看决定、灵感、计划完成、两人都选中的照片（服务端拼装，需要联网）（P6）
  - name: decisions
    description: 决定记录：问题、备选、各自关注点、最终决定、复查日期（P6）
  - name: archive
    description: 档案：长期共同事实与不可变的修订历史（P6）
  - name: board
    description: 留言板：主题、留言（可引用、可修订）、回应、搜索（P5）
  - name: ai
    description: AI（P4）：请求立即返回 202，结果异步写进对应实体，并通过 WebSocket 发 ai.done
  - name: plans
    description: 计划、阶段、里程碑与记录（P4）

paths:
  # ───────────────────────── 系统 ─────────────────────────
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ───────────────────────── 账号 ─────────────────────────
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 注册
      description: |
        - 系统里还没有任何用户时，可以不带邀请码注册（第一个账号）。
        - 否则必须带有效的 `inviteCode`，注册成功后自动以 `member` 身份加入该邀请码所属的房间。
        - `username` 由客户端先转成小写再提交。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功，返回令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }      # invalid_request / invite_invalid
        '403': { $ref: '#/components/responses/Forbidden' }       # registration_closed
        '409': { $ref: '#/components/responses/Conflict' }        # username_taken / room_full
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录
      description: 同一用户名连续 5 次密码错误后限流（429，看 `Retry-After`）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }    # 用户名或密码不正确
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: 刷新令牌
      description: |
        每次刷新都换一对新令牌，旧刷新令牌立即作废。
        已作废的刷新令牌被再次使用 → 这次登录（这台设备）的所有令牌全部作废，返回 401。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 新令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出
      description: 作废这次登录（以访问令牌为准）的所有刷新令牌，并注销这次登录注册的推送设备。请求体可省略。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204':
          description: 已登出
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── 当前用户 ─────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: 当前用户与所在房间
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: 修改显示名、头像、通知偏好
      description: 显示名或头像变化时，用户所在每个房间都会产生一条 `member` 变化。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: 修改后的当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/sessions:
    get:
      tags: [me]
      operationId: listSessions
      summary: 我的有效登录（每次登录 = 一台设备），最近用过的在前
      responses:
        '200':
          description: 登录
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoginSession' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [me]
      operationId: revokeSession
      summary: 让这台设备退出登录（可以是当前设备，等于登出）
      responses:
        '204': { description: 已退出 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/password:
    post:
      tags: [me]
      operationId: changePassword
      summary: 改密码
      description: 成功后作废其它所有登录；返回当前设备的一对新令牌。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: 当前设备的新令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }    # 当前密码不正确
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────── 房间 ─────────────────────────
  /rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: 建房间
      description: 创建者成为 `owner`，在设计系统里用 personA 的颜色。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomRequest' }
      responses:
        '200':
          description: 同 id 的房间已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomDetail' }
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [rooms]
      operationId: getRoom
      summary: 房间与成员
      responses:
        '200':
          description: 房间
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [rooms]
      operationId: updateRoom
      summary: 修改房间设置
      description: 两位成员都可以修改。`timezone` 必须是 IANA 时区名（如 `Asia/Shanghai`）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoomRequest' }
      responses:
        '200':
          description: 修改后的房间
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/invites:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [rooms]
      operationId: createInvite
      summary: 生成邀请码
      description: |
        仅 owner。8 位，只用 `ABCDEFGHJKMNPQRSTUVWXYZ23456789` 中的字符，7 天有效。
        生成新码后，这个房间之前未使用的邀请码全部失效。房间已满 2 人时返回 409 `room_full`。
      responses:
        '201':
          description: 新邀请码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invites/accept:
    post:
      tags: [rooms]
      operationId: acceptInvite
      summary: 已登录用户用邀请码加入房间
      description: 已经是该房间成员时直接返回 200。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '200':
          description: 加入的房间
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }      # invite_invalid
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }        # room_full

  # ───────────────────────── 同步 ─────────────────────────
  /rooms/{roomId}/bootstrap:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [sync]
      operationId: bootstrapRoom
      summary: 首次同步快照
      description: |
        首次安装或清除数据后调用。在同一个一致性快照里返回：房间、成员、`lastSeq`、
        除消息外所有同步实体的当前状态（含已软删除的，用于回收站）、自己的未读位置、最近 50 条消息。
        之后用 `sync?since=lastSeq` 增量拉取。
      responses:
        '200':
          description: 快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bootstrap' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/sync:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [sync]
      operationId: syncRoom
      summary: 增量同步
      description: |
        返回 `seq > since` 的变化，按 `seq` 升序。
        - 同一个实体在本页范围内变化多次，只返回最后一次；`data` 是实体的完整当前状态，客户端直接覆盖本地。
        - `toSeq` 是本页扫描到的最大 seq，下次用它作为 `since`。它可能大于 `changes` 里最大的 `seq`
          （有些变化被合并了，或对你不可见，比如对方的 `read_marker`）。
        - `hasMore = true` 时立即用 `toSeq` 继续拉。
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: 变化
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ws:
    get:
      tags: [sync]
      operationId: openRealtime
      summary: 实时通道（WebSocket）
      description: |
        握手时带 `Authorization: Bearer {accessToken}`。服务端 → 客户端的消息见
        `WsHello`、`WsChanged`、`WsAiDone`（第 4 阶段）。
        - `changed` 只是提示，客户端收到且 `seq > 本地 lastSeq` 时调用 `sync` 拉取。
        - 客户端不发业务消息；心跳用 WebSocket ping/pong 帧（30 秒）。
        - 没有「正在输入」「在线」等事件（产品明确不做）。
      responses:
        '101':
          description: 协议切换为 WebSocket
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── 心情 ─────────────────────────
  /rooms/{roomId}/moods:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [moods]
      operationId: createMood
      summary: 记录心情
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMoodRequest' }
      responses:
        '200': { $ref: '#/components/responses/MoodExisting' }
        '201': { $ref: '#/components/responses/MoodCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/moods/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [moods]
      operationId: deleteMood
      summary: 删除心情（仅作者）
      responses:
        '200': { $ref: '#/components/responses/MoodOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/moods/{moodId}/responses:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: moodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [moods]
      operationId: createMoodReply
      summary: 回应对方的心情
      description: |
        `here` 我在这里 / `hug` 给你一个拥抱 / `ready` 等你准备好。
        只能回应对方的心情（回应自己的返回 403）。回应不产生任何待办或提醒数字。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMoodReplyRequest' }
      responses:
        '200':
          description: 同 id 的回应已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoodReply' }
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoodReply' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/mood-responses/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [moods]
      operationId: deleteMoodReply
      summary: 收回回应（仅作者）
      responses:
        '200':
          description: 已收回（带 `deletedAt`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoodReply' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── 待办 ─────────────────────────
  /rooms/{roomId}/todos:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [todos]
      operationId: createTodo
      summary: 新建待办
      description: |
        - 子任务：带 `parentId`；父待办必须在同一房间且本身不是子任务（只有一层）。子任务不能重复。
        - 重复：`recurrence` 是 RRULE，支持 `FREQ=DAILY|WEEKLY|MONTHLY`、`INTERVAL`、`BYDAY`；重复待办必须有截止日。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTodoRequest' }
      responses:
        '200': { $ref: '#/components/responses/TodoExisting' }
        '201': { $ref: '#/components/responses/TodoCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/todos/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [todos]
      operationId: updateTodo
      summary: 修改待办
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTodoRequest' }
      responses:
        '200': { $ref: '#/components/responses/TodoOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [todos]
      operationId: deleteTodo
      summary: 删除待办
      description: 子任务随父待办一起进回收站；恢复父待办时一起恢复。
      responses:
        '200': { $ref: '#/components/responses/TodoOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/todos/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [todos]
      operationId: completeTodo
      summary: 完成待办
      description: |
        重复待办必须带 `nextId`（客户端生成），服务端据此生成下一次实例（`recurrencePrevId` 指向本条）。
        已完成的待办再次提交完成：返回 200 和当前状态，不会生成第二个下一次实例。
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteTodoRequest' }
      responses:
        '200':
          description: 完成后的待办，以及生成的下一次实例
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompleteTodoResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/todos/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [todos]
      operationId: reopenTodo
      summary: 取消完成
      description: 已生成的下一次实例保留不动。
      responses:
        '200': { $ref: '#/components/responses/TodoOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── 日程 ─────────────────────────
  /rooms/{roomId}/events:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [events]
      operationId: createEvent
      summary: 新建日程
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
      responses:
        '200': { $ref: '#/components/responses/EventExisting' }
        '201': { $ref: '#/components/responses/EventCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/events/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [events]
      operationId: updateEvent
      summary: 修改日程
      description: 在全天和定时之间切换时，要同时发新形态需要的时间字段，并把另一形态的字段设为 `null`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventRequest' }
      responses:
        '200': { $ref: '#/components/responses/EventOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [events]
      operationId: deleteEvent
      summary: 删除日程
      responses:
        '200': { $ref: '#/components/responses/EventOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/calendar/import:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [calendar]
      operationId: importCalendar
      summary: 导入 ICS 日程
      description: |
        在线上传至多 2 MiB 的 .ics 文件，只导入 VEVENT。按同一房间的 UID 去重；
        全天事件的 DTEND 为排他日期，存入日程时换算为含首尾日期。
        不支持的事件记入 skipped，不影响其它事件。导入的日程按普通日程同步。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /rooms/{roomId}/calendar/export.ics:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [calendar]
      operationId: exportCalendar
      summary: 导出房间日历
      description: 含未删除的日程、待办截止、计划目标和里程碑。
      responses:
        '200':
          description: ICS 文件
          content:
            text/calendar:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/calendar/subscription:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [calendar]
      operationId: calendarSubscription
      summary: 生成或重置只读订阅链接
      description: 首次生成；已有链接时返回原链接，reset 为 true 时使旧链接立即失效。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarSubscriptionRequest' }
      responses:
        '200':
          description: 可分享的订阅链接
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ics/{token}.ics:
    get:
      tags: [calendar]
      operationId: readCalendarSubscription
      summary: 无需登录的只读日历订阅
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        '200':
          description: 实时 ICS 文件
          content:
            text/calendar:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── 聊天 ─────────────────────────
  /rooms/{roomId}/messages:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [messages]
      operationId: listMessages
      summary: 往上翻历史
      description: 返回 `createdSeq < beforeSeq` 的消息，按 `createdSeq` 降序（最新的在前）。不传 `beforeSeq` 时从最新开始。
      parameters:
        - name: beforeSeq
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 一页消息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [messages]
      operationId: sendMessage
      summary: 发消息
      description: |
        - `text`：`body` 必填，去掉首尾空白后不能为空，≤ 10,000 字。
        - `image` / `file`：先上传到 `/rooms/{roomId}/files`，再带 `fileId` 发送（因此必须在线）。
        - 带 `replyToId` 时，服务端填写 `replyAuthorId` 和 `replyExcerpt`（原消息前 60 字）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200': { $ref: '#/components/responses/MessageExisting' }
        '201': { $ref: '#/components/responses/MessageCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/messages/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: 删除消息进回收站
      description: 两位成员都可以删除房间里的任何消息；可以从回收站恢复。
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/messages/{id}/retract:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [messages]
      operationId: retractMessage
      summary: 撤回（仅作者）
      description: |
        清空 `body` 和 `file`，保留 `retractedBy` / `retractedAt`；回复了这条消息的其它消息的 `replyExcerpt` 同时清空。
        撤回后不出现在搜索和导出里。重复撤回返回 200。
      responses:
        '200': { $ref: '#/components/responses/MessageOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/messages/search:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [messages]
      operationId: searchMessages
      summary: 搜索消息
      description: 按 `createdSeq` 降序；不含已撤回、已删除的消息。
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSearchPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/read-marker:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    put:
      tags: [messages]
      operationId: updateReadMarker
      summary: 推进自己的未读位置
      description: 服务端保存 `max(旧值, 新值)`，只进不退；只会同步给自己，不暴露给对方。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReadMarkerRequest' }
      responses:
        '200':
          description: 当前的未读位置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadMarker' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── 文件 ─────────────────────────
  /rooms/{roomId}/files:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [files]
      operationId: uploadFile
      summary: 上传文件
      description: |
        图片 ≤ 20MB（JPEG、PNG、WebP、HEIC、GIF）；其它文件 ≤ 100MB。
        服务端计算 sha256，按 `{roomId}/{yyyy}/{mm}/{fileId}` 存放；图片记录宽高。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadFileForm' }
      responses:
        '200':
          description: 同 id 的文件已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileMeta' }
        '201':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: downloadFile
      summary: 下载文件
      description: 需要是文件所属房间的成员（否则 404）。支持 `Range`；`ETag` 为 sha256，内容不变，可长期缓存（带 If-None-Match 时 304）。
      parameters:
        - name: Range
          in: header
          schema: { type: string, example: 'bytes=0-1048575' }
      responses:
        '200':
          description: 文件内容
          headers:
            Content-Disposition:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '304':
          description: If-None-Match 命中
        '206':
          description: 部分内容
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /files/{fileId}/thumb:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: getThumbnail
      summary: 图片缩略图（JPEG）
      description: |
        只对图片（image / avatar / hero）有效，其它类型返回 404。首次请求时生成并缓存。
        原图比请求的宽度窄时不放大。服务端解不开的格式（HEIC）也返回 404，客户端改用原图。
      parameters:
        - name: w
          in: query
          required: true
          schema: { type: integer, enum: [200, 400, 800] }
      responses:
        '200':
          description: 缩略图
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
        '304':
          description: If-None-Match 命中
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── 回收站 ─────────────────────────
  /rooms/{roomId}/trash:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [trash]
      operationId: listTrash
      summary: 回收站列表
      description: 按 `deletedAt` 降序。随父待办一起删除的子任务不单独列出。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 一页回收站条目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/trash/{type}/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: type
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TrashType' }
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [trash]
      operationId: purgeTrashItem
      summary: 彻底删除
      description: 只能彻底删除已在回收站里的条目；产生 `op = delete` 的变化，客户端收到后物理删除本地行。
      responses:
        '204':
          description: 已彻底删除
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/trash/{type}/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: type
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TrashType' }
      - $ref: '#/components/parameters/Id'
    post:
      tags: [trash]
      operationId: restoreTrashItem
      summary: 恢复
      description: 清空 `deletedAt` / `deletedBy`，内容按删除前的状态回来；消息回到原来的位置（`createdSeq` 不变）。
      responses:
        '200':
          description: 恢复后的实体
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Change' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── 双人问答 ─────────────────────────
  /rooms/{roomId}/qna/today:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [qna]
      operationId: getTodayQna
      summary: 按房间时区取得或创建今日轮次
      responses:
        '200':
          description: 今日与昨日问答；揭晓前不含对方答案
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QnaToday' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/qna/rounds/{roundId}/answer:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: roundId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    put:
      tags: [qna]
      operationId: writeQnaAnswer
      summary: 写入或修改自己的答案
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteAnswerRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Answer' }
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Answer' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rooms/{roomId}/qna/rounds/{roundId}/confirm:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: roundId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [qna]
      operationId: confirmQnaAnswer
      summary: 确认自己的答案，双方确认后同时揭晓
      responses:
        '200':
          description: 轮次当前状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QnaRound' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/questions:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [qna]
      operationId: listQuestions
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [adopted, suggested], default: adopted }
      responses:
        '200':
          description: 题库或待采纳建议
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Question' }
    post:
      tags: [qna]
      operationId: createQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuestionRequest' }
      responses:
        '200':
          description: 同 id 已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
  /rooms/{roomId}/questions/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [qna]
      operationId: deleteQuestion
      summary: 软删除题目，进入回收站
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/questions/{id}/adopt:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [qna]
      operationId: adoptQuestion
      responses:
        '200':
          description: 已采纳
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/ai/question-suggest:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [ai, qna]
      operationId: suggestQuestion
      summary: 根据共同历史异步出题
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionSuggestRequest' }
      responses:
        '202':
          description: 已入队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiJobAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/AiQuotaExceeded' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  # ───────────────────────── 计划 ─────────────────────────
  /rooms/{roomId}/ideas:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [ideas]
      operationId: createIdea
      summary: 记下一条灵感
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateIdeaRequest' } } }
      responses:
        '200': { description: 同 id 已存在, content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } } }
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/ideas/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [ideas]
      operationId: updateIdea
      summary: 修改灵感（仅作者）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateIdeaRequest' } } }
      responses:
        '200': { description: 修改后的灵感, content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [ideas]
      operationId: deleteIdea
      summary: 删除灵感进回收站（两位成员都可以）
      responses:
        '200': { description: 删除后的灵感, content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

