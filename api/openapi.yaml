      type: string
      enum: [text, image, file, ai, system]
    FileKind:
      type: string
      enum: [image, file, avatar, hero, epub, review]
    FileMeta:
      type: object
      required: [id, roomId, kind, fileName, mimeType, sizeBytes, sha256, width, height, uploadedBy, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        roomId: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/FileKind' }
        fileName: { type: string, example: 行程草稿.pdf }
        mimeType: { type: string, example: application/pdf }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        uploadedBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/Instant' }
    Message:
      description: 同步实体类型 `message`
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [authorId, kind, body, file, replyToId, replyAuthorId, replyExcerpt, retractedAt, retractedBy, createdSeq]
          properties:
            authorId:
              $ref: '#/components/schemas/NullableUuid'
              description: '`ai` / `system` 消息为空'
            kind: { $ref: '#/components/schemas/MessageKind' }
            body: { type: string, maxLength: 10000, description: 撤回后为空字符串 }
            file:
              description: 图片或文件消息所附文件的元数据；撤回后为 `null`
              oneOf:
                - $ref: '#/components/schemas/FileMeta'
                - type: 'null'
            replyToId: { $ref: '#/components/schemas/NullableUuid' }
            replyAuthorId: { $ref: '#/components/schemas/NullableUuid' }
            replyExcerpt: { type: [string, 'null'], maxLength: 60 }
            retractedAt: { $ref: '#/components/schemas/NullableInstant' }
            retractedBy: { $ref: '#/components/schemas/NullableUuid' }
            createdSeq:
              type: integer
              format: int64
              description: 创建时分配的 seq，决定消息在聊天里的位置，之后不变
            aiPrompt:
              type: [string, 'null']
              maxLength: 2000
              description: AI 回答（`kind = ai`）是回答哪个问题的；其它消息为空（P4）
            aiSources:
              type: array
              description: AI 回答正文里用 [n] 引用到的房间资料（P8-01）；其它消息为空数组
              items: { $ref: '#/components/schemas/SummarySource' }
    SendMessageRequest:
      type: object
      required: [id, kind]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [text, image, file] }
        body: { type: string, maxLength: 10000 }
        fileId: { $ref: '#/components/schemas/Uuid' }
        replyToId: { $ref: '#/components/schemas/Uuid' }
    MessagePage:
      type: object
      required: [messages, hasMore]
      properties:
        messages:
          type: array
          description: 按 `createdSeq` 降序
          items: { $ref: '#/components/schemas/Message' }
        hasMore: { type: boolean }
    MessageSearchPage:
      type: object
      required: [messages, nextCursor]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        nextCursor: { type: [string, 'null'] }
    ReadMarker:
      description: 同步实体类型 `read_marker`；只同步给本人
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [userId, lastReadSeq]
          properties:
            userId: { $ref: '#/components/schemas/Uuid' }
            lastReadSeq:
              type: integer
              format: int64
              description: 读到的最后一条消息的 `createdSeq`
    UpdateReadMarkerRequest:
      type: object
      required: [lastReadSeq]
      properties:
        lastReadSeq: { type: integer, format: int64, minimum: 0 }

    # ── 文件 ──
    UploadFileForm:
      type: object
      required: [file, kind]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: 文件内容；文件名取自 multipart 的 filename
        kind:
          type: string
          enum: [image, file, avatar, hero, epub, review]
          description: review = 审稿原文件（PDF、Word、Excel、PowerPoint、OpenDocument、RTF、纯文本），≤ 100MB
        id:
          $ref: '#/components/schemas/Uuid'
          description: 客户端生成的文件 id，用于重试时去重；不传则由服务端生成

    # ── 审稿（P7）──
    ReviewFormat:
      type: string
      description: 原文件类别：pdf；text（Word、ODT、RTF、纯文本）；sheet（Excel、ODS、CSV）；slides（PowerPoint、ODP）
      enum: [pdf, text, sheet, slides]
    PreviewStatus:
      type: string
      enum: [pending, ready, failed]
    AnchorKind:
      type: string
      enum: [region, paragraph, cell, slide, image]
    AnnotationKind:
      type: string
      description: comment = 意见；proposal = 修改提议
      enum: [comment, proposal]
    AnnotationStatus:
      type: string
      enum: [open, accepted, archived]
    DiffKind:
      type: string
      enum: [same, removed, added]
    NormRect:
      type: object
      description: 页面上的矩形，按页面宽高的比例（0–1），左上角为原点
      required: [x, y, w, h]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        w: { type: number, minimum: 0, maximum: 1 }
        h: { type: number, minimum: 0, maximum: 1 }
    AnnotationAnchor:
      type: object
      required: [page, kind]
      properties:
        page: { type: integer, minimum: 1 }
        kind: { $ref: '#/components/schemas/AnchorKind' }
        rect:
          oneOf: [{ $ref: '#/components/schemas/NormRect' }, { type: 'null' }]
          description: region、image 必填
        ref: { type: [string, 'null'], maxLength: 32, description: 文字层里的块 id，paragraph、cell 必填 }
        quote: { type: [string, 'null'], maxLength: 500, description: 原文摘录，用于在新版本里重新找到位置 }
    ReviewDocument:
      description: 同步实体类型 `review_document`（P7）
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [title, createdBy, latestVersion]
          properties:
            title: { type: string, minLength: 1, maxLength: 100 }
            createdBy: { $ref: '#/components/schemas/Uuid' }
            latestVersion: { type: integer, minimum: 1 }
    ReviewVersion:
      description: 同步实体类型 `review_version`（P7）：原文件不可变；预览在后台生成
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [documentId, version, fileId, fileName, format, uploadedBy, previewStatus, pageCount, previewError]
          properties:
            documentId: { $ref: '#/components/schemas/Uuid' }
            version: { type: integer, minimum: 1 }
            fileId: { $ref: '#/components/schemas/Uuid' }
            fileName: { type: string }
            format: { $ref: '#/components/schemas/ReviewFormat' }
            uploadedBy: { $ref: '#/components/schemas/Uuid' }
            previewStatus: { $ref: '#/components/schemas/PreviewStatus' }
            pageCount: { type: [integer, 'null'] }
            previewError: { type: [string, 'null'] }
    Annotation:
      description: 同步实体类型 `annotation`（P7）：批注或修改提议；带到新版本的是新的一条，carriedFromId 指向旧的
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [documentId, versionId, anchor, authorId, kind, status, body, carriedFromId, anchorLost, resolvedBy, resolvedAt]
          properties:
            documentId: { $ref: '#/components/schemas/Uuid' }
            versionId: { $ref: '#/components/schemas/Uuid' }
            anchor: { $ref: '#/components/schemas/AnnotationAnchor' }
            authorId: { $ref: '#/components/schemas/Uuid' }
            kind: { $ref: '#/components/schemas/AnnotationKind' }
            status: { $ref: '#/components/schemas/AnnotationStatus' }
            body: { type: string, minLength: 1, maxLength: 2000 }
            carriedFromId: { $ref: '#/components/schemas/NullableUuid' }
            anchorLost: { type: boolean, description: 带到新版本时没找到原来的位置 }
            resolvedBy: { $ref: '#/components/schemas/NullableUuid' }
            resolvedAt: { oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }] }
    AnnotationReply:
      description: 同步实体类型 `annotation_reply`（P7）：批注下面的讨论
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [annotationId, authorId, body]
          properties:
            annotationId: { $ref: '#/components/schemas/Uuid' }
            authorId: { $ref: '#/components/schemas/Uuid' }
            body: { type: string, minLength: 1, maxLength: 2000 }
    TextBlock:
      type: object
      required: [id, kind, rect, text]
      properties:
        id: { type: string, description: 在这个版本里唯一，如 p2-b5 }
        kind: { $ref: '#/components/schemas/AnchorKind' }
        rect: { $ref: '#/components/schemas/NormRect' }
        text: { type: string }
    ReviewPage:
      type: object
      required: [page, width, height, imageFileId, blocks, images]
      properties:
        page: { type: integer, minimum: 1 }
        width: { type: number, description: 页面宽（pt） }
        height: { type: number, description: 页面高（pt） }
        imageFileId: { $ref: '#/components/schemas/Uuid' }
        blocks: { type: array, items: { $ref: '#/components/schemas/TextBlock' } }
        images: { type: array, items: { $ref: '#/components/schemas/NormRect' } }
    ReviewDiffLine:
      type: object
      required: [kind, text, oldPage, newPage]
      properties:
        kind: { $ref: '#/components/schemas/DiffKind' }
        text: { type: string }
        oldPage: { type: [integer, 'null'] }
        newPage: { type: [integer, 'null'] }
    ReviewDiff:
      type: object
      required: [from, to, lines]
      properties:
        from: { type: integer }
        to: { type: integer }
        lines: { type: array, items: { $ref: '#/components/schemas/ReviewDiffLine' } }
    CreateReviewVersionRequest:
      type: object
      required: [id, fileId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        fileId: { $ref: '#/components/schemas/Uuid' }
    CreateReviewRequest:
      type: object
      required: [id, title, firstVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 100 }
        firstVersion: { $ref: '#/components/schemas/CreateReviewVersionRequest' }
    UpdateReviewRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
    CreateAnnotationRequest:
      type: object
      required: [id, versionId, anchor, kind, body]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        versionId: { $ref: '#/components/schemas/Uuid' }
        anchor: { $ref: '#/components/schemas/AnnotationAnchor' }
        kind: { $ref: '#/components/schemas/AnnotationKind' }
        body: { type: string, minLength: 1, maxLength: 2000 }
    UpdateAnnotationRequest:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        status: { $ref: '#/components/schemas/AnnotationStatus' }
    CreateAnnotationReplyRequest:
      type: object
      required: [id, body]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        body: { type: string, minLength: 1, maxLength: 2000 }

    FindingStatus:
      type: string
      enum: [new, dismissed, converted]
    FindingEvidence:
      type: object
      required: [page, ref, quote, rect]
      properties:
        page: { type: integer, minimum: 1 }
        ref: { type: string, description: 文字层里的块 id }
        quote: { type: string, description: 原文摘录（一定是那一块里的原话） }
        rect: { $ref: '#/components/schemas/NormRect' }
    AiFinding:
      description: 同步实体类型 `ai_finding`（P7-03）：AI 审稿发现，一定带原文证据；只能忽略或转为人工批注，AI 不替人定稿
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [documentId, versionId, jobId, requestedBy, title, body, evidence, status, convertedAnnotationId, carriedFromId, goneInVersion, resolvedBy]
          properties:
            documentId: { $ref: '#/components/schemas/Uuid' }
            versionId: { $ref: '#/components/schemas/Uuid' }
            jobId: { $ref: '#/components/schemas/Uuid' }
            requestedBy: { $ref: '#/components/schemas/NullableUuid' }
            title: { type: string, maxLength: 60 }
            body: { type: string, maxLength: 600 }
            evidence: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/FindingEvidence' } }
            status: { $ref: '#/components/schemas/FindingStatus' }
            convertedAnnotationId: { $ref: '#/components/schemas/NullableUuid' }
            carriedFromId: { $ref: '#/components/schemas/NullableUuid' }
            goneInVersion: { type: [integer, 'null'], description: 在这个版本里找不到证据原文了（可能已改好） }
            resolvedBy: { $ref: '#/components/schemas/NullableUuid' }
    AiReviewFindingsRequest:
      type: object
      required: [jobId, documentId, versionId]
      properties:
        jobId: { $ref: '#/components/schemas/Uuid' }
        documentId: { $ref: '#/components/schemas/Uuid' }
        versionId: { $ref: '#/components/schemas/Uuid' }
    ConvertFindingRequest:
      type: object
      required: [annotationId]
      properties:
        annotationId: { $ref: '#/components/schemas/Uuid' }

    AiActionKind:
      type: string
      enum: [event, todo, archive_item, idea]
    AiActionStatus:
      type: string
      enum: [proposed, accepted, dismissed]
    AiActionDraft:
      type: object
      description: |
        AI 提议的草稿，按 kind 取用字段：event 用 title/note/location 和 allDay + startDate/endDate 或 startsAt/endsAt；
        todo 用 title/note/assigneeId/dueDate 或 dueAt/planId；archive_item 用 archiveKind/title/note（正文）；idea 用 title（正文）。
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 2000 }
        note: { type: [string, 'null'], maxLength: 2000 }
        allDay: { type: boolean, default: false }
        startsAt: { $ref: '#/components/schemas/NullableInstant' }
        endsAt: { $ref: '#/components/schemas/NullableInstant' }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        location: { type: [string, 'null'], maxLength: 200 }
        assigneeId: { $ref: '#/components/schemas/NullableUuid' }
        dueDate: { type: [string, 'null'], format: date }
        dueAt: { $ref: '#/components/schemas/NullableInstant' }
        planId: { $ref: '#/components/schemas/NullableUuid' }
        archiveKind:
          oneOf:
            - $ref: '#/components/schemas/ArchiveKind'
            - type: 'null'
    AiAction:
      description: 同步实体类型 `ai_action`（P8-02）：问 AI 时 AI 提议的动作，人点「好」才由服务端建成真正的实体；没有回收站
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [messageId, position, kind, draft, status, resultId, decidedBy, requestedBy]
          properties:
            messageId: { $ref: '#/components/schemas/Uuid', description: 属于哪条 AI 回答（= 那次问 AI 的 jobId） }
            position: { type: integer, minimum: 0 }
            kind: { $ref: '#/components/schemas/AiActionKind' }
            draft: { $ref: '#/components/schemas/AiActionDraft' }
            status: { $ref: '#/components/schemas/AiActionStatus' }
            resultId: { $ref: '#/components/schemas/NullableUuid' }
            decidedBy: { $ref: '#/components/schemas/NullableUuid' }
            requestedBy: { $ref: '#/components/schemas/NullableUuid' }
    AcceptAiActionRequest:
      type: object
      required: [resultId]
      properties:
        resultId: { $ref: '#/components/schemas/Uuid', description: 要建的实体的 id（客户端生成），重试不会多建 }

    AppRelease:
      type: object
      required: [versionCode, versionName, notes, sizeBytes, sha256, publishedAt]
      properties:
        versionCode: { type: integer }
        versionName: { type: string }
        notes: { type: string, description: 这一版改了什么 }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
        publishedAt: { $ref: '#/components/schemas/Instant' }

    # ── 回收站 ──
    TrashType:
      type: string
      description: 第 3 阶段可恢复的类型，后续阶段追加
      enum: [message, mood, todo, event, question, plan, idea, document, board_topic, board_post, archive_item, decision, book, summary, plan_stage, milestone, review_document, annotation, doc_comment]
    TrashItem:
      type: object
      required: [type, id, deletedAt, deletedBy, data]
      properties:
        type: { $ref: '#/components/schemas/TrashType' }
        id: { $ref: '#/components/schemas/Uuid' }
        deletedAt: { $ref: '#/components/schemas/Instant' }
        deletedBy: { $ref: '#/components/schemas/Uuid' }
        data:
          oneOf:
            - $ref: '#/components/schemas/Message'
            - $ref: '#/components/schemas/Mood'
            - $ref: '#/components/schemas/Todo'
            - $ref: '#/components/schemas/Event'
            - $ref: '#/components/schemas/Question'
            - $ref: '#/components/schemas/Plan'
            - $ref: '#/components/schemas/Idea'
            - $ref: '#/components/schemas/Document'
            - $ref: '#/components/schemas/BoardTopic'
            - $ref: '#/components/schemas/BoardPost'
            - $ref: '#/components/schemas/ArchiveItem'
            - $ref: '#/components/schemas/Decision'
            - $ref: '#/components/schemas/Book'
            - $ref: '#/components/schemas/Summary'
            - $ref: '#/components/schemas/PlanStage'
            - $ref: '#/components/schemas/Milestone'
            - $ref: '#/components/schemas/ReviewDocument'
            - $ref: '#/components/schemas/Annotation'
    TrashPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TrashItem' }
        nextCursor: { type: [string, 'null'] }

    # ── AI（P4）──
    AiJobKind:
      type: string
      enum: [chat_answer, question_suggest, read_explain, review_findings, summary, yearly_review, write_assist]
    WriteAssistMode:
      type: string
      enum: [polish, proofread, shorten, titles, draft]
    DraftGenre:
      type: string
      enum: [travel, letter, review]
    AiWriteRequest:
      type: object
      required: [jobId, mode]
      description: polish / proofread / shorten 带 text（选中的一段，最多 4000 字）；titles 带 text（整篇，最多 8000 字）；draft 带 genre 和 rangeStart～rangeEnd（最多 31 天）
      properties:
        jobId: { $ref: '#/components/schemas/Uuid' }
        mode: { $ref: '#/components/schemas/WriteAssistMode' }
        text: { type: string, maxLength: 8000 }
        documentId: { $ref: '#/components/schemas/Uuid' }
        genre: { $ref: '#/components/schemas/DraftGenre' }
        rangeStart: { $ref: '#/components/schemas/LocalDate' }
        rangeEnd: { $ref: '#/components/schemas/LocalDate' }
    AiJobStatus:
      type: string
      enum: [queued, running, done, failed]
    AiChatRequest:
      type: object
      required: [jobId, prompt]
      properties:
        jobId: { $ref: '#/components/schemas/Uuid' }
        prompt: { type: string, minLength: 1, maxLength: 2000 }
        sourceMessageId:
          $ref: '#/components/schemas/Uuid'
          description: 长按一条消息「让 AI 整理」：把这条消息整理成动作草稿（P8-02）
    AiJobAccepted:
      type: object
      required: [jobId, status]
      properties:
        jobId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/AiJobStatus' }
    AiJob:
      type: object
      required: [id, roomId, kind, status, model, inputTokens, outputTokens, resultRef, error, createdAt, finishedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        roomId: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/AiJobKind' }
        status: { $ref: '#/components/schemas/AiJobStatus' }
        model: { type: [string, 'null'] }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        resultRef: { type: [string, 'null'], example: 'message:0192f3a0-0000-7000-8000-000000000000' }
        error: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Instant' }
        finishedAt: { $ref: '#/components/schemas/NullableInstant' }
        resultText: { type: [string, 'null'], description: 写作助手（write_assist）的结果文字，只给发起的人看；其它情况为空（P9-04） }
    AiUsage:
      type: object
      required: [month, jobs, myInputTokens, myOutputTokens, monthUsedTokens, monthLimitTokens]
      properties:
        month: { type: string, example: '2026-09' }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/AiJob' }
        myInputTokens: { type: integer, format: int64 }
        myOutputTokens: { type: integer, format: int64 }
        monthUsedTokens: { type: integer, format: int64 }
        monthLimitTokens: { type: integer, format: int64 }

    # ── 推送设备 ──
    PushProvider:
      type: string
      enum: [fcm, unifiedpush]
    Device:
      type: object
      required: [id, provider, token, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        provider: { $ref: '#/components/schemas/PushProvider' }
        token: { type: string, description: FCM 令牌，或 UnifiedPush 推送地址 }
        createdAt: { $ref: '#/components/schemas/Instant' }
    RegisterDeviceRequest:
      type: object
      required: [id, provider, token]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        provider: { $ref: '#/components/schemas/PushProvider' }
        token: { type: string, minLength: 1, maxLength: 4096 }
