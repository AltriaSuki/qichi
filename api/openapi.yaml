      description: |
        同步实体类型 `event`。
        定时日程：`allDay = false`，用 `startsAt` / `endsAt`；
        全天日程：`allDay = true`，用 `startDate` / `endDate`（含首尾，按房间时区）。另一组字段为 `null`。
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [title, note, location, allDay, startsAt, endsAt, startDate, endDate, participantIds, createdBy, icsUid]
          properties:
            title: { type: string, minLength: 1, maxLength: 200 }
            note: { type: [string, 'null'], maxLength: 2000 }
            location: { type: [string, 'null'], maxLength: 200 }
            allDay: { type: boolean }
            startsAt: { $ref: '#/components/schemas/NullableInstant' }
            endsAt: { $ref: '#/components/schemas/NullableInstant' }
            startDate: { $ref: '#/components/schemas/NullableLocalDate' }
            endDate: { $ref: '#/components/schemas/NullableLocalDate' }
            participantIds:
              type: array
              description: 为空 = 两个人
              items: { $ref: '#/components/schemas/Uuid' }
            createdBy: { $ref: '#/components/schemas/Uuid' }
            icsUid: { type: [string, 'null'] }
    CreateEventRequest:
      type: object
      required: [id, title, allDay]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        note: { type: string, maxLength: 2000 }
        location: { type: string, maxLength: 200 }
        allDay: { type: boolean }
        startsAt: { $ref: '#/components/schemas/Instant' }
        endsAt: { $ref: '#/components/schemas/Instant' }
        startDate: { $ref: '#/components/schemas/LocalDate' }
        endDate: { $ref: '#/components/schemas/LocalDate' }
        participantIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    UpdateEventRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 2000 }
        location: { type: [string, 'null'], maxLength: 200 }
        allDay: { type: boolean }
        startsAt: { $ref: '#/components/schemas/NullableInstant' }
        endsAt: { $ref: '#/components/schemas/NullableInstant' }
        startDate: { $ref: '#/components/schemas/NullableLocalDate' }
        endDate: { $ref: '#/components/schemas/NullableLocalDate' }
        participantIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }

