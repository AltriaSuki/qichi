      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReviseBoardPostRequest' } } }
      responses:
        '200': { description: 修订后的留言, content: { application/json: { schema: { $ref: '#/components/schemas/BoardPost' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [board]
      operationId: deleteBoardPost
      summary: 删除留言进回收站（两位成员都可以）
      responses:
        '200': { description: 删除后的留言, content: { application/json: { schema: { $ref: '#/components/schemas/BoardPost' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/board/posts/{id}/revisions:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    get:
      tags: [board]
      operationId: listBoardPostRevisions
      summary: 修订历史（旧版本，修订号从大到小；不含当前内容）
      responses:
        '200':
          description: 旧版本
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BoardPostRevision' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/board/posts/{id}/reactions/{kind}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/BoardReactionKind' }
    put:
      tags: [board]
      operationId: putBoardReaction
      summary: 回应一条留言（不能回应自己的；同一种回应已有时返回已有的）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PutBoardReactionRequest' } } }
      responses:
        '200': { description: 已经回应过, content: { application/json: { schema: { $ref: '#/components/schemas/BoardReaction' } } } }
        '201': { description: 已回应, content: { application/json: { schema: { $ref: '#/components/schemas/BoardReaction' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [board]
      operationId: deleteBoardReaction
      summary: 收回自己的这种回应（没有时 404）
      responses:
        '200': { description: 收回后的回应（带 deletedAt）, content: { application/json: { schema: { $ref: '#/components/schemas/BoardReaction' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/board/search:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [board]
      operationId: searchBoard
      summary: 搜索主题标题与留言正文（不区分大小写，最多 50 条）
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200': { description: 搜索结果, content: { application/json: { schema: { $ref: '#/components/schemas/BoardSearchResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/plans:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [plans]
      operationId: listPlans
      responses:
        '200':
          description: 房间内未删除的计划
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [plans]
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlanRequest' }
      responses:
        '200': { description: 同 id 已存在, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/plans/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    get:
      tags: [plans]
      operationId: getPlan
      responses:
        '200': { description: 计划及其阶段、里程碑、记录, content: { application/json: { schema: { $ref: '#/components/schemas/PlanDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [plans]
      operationId: updatePlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlanRequest' }
      responses:
        '200': { description: 修改后计划, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [plans]
      operationId: deletePlan
      responses:
        '200': { description: 已移入回收站, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/plans/{planId}/stages:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/PlanId'
    post:
      tags: [plans]
      operationId: createPlanStage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlanStageRequest' }
      responses:
        '200': { description: 同 id 已存在, content: { application/json: { schema: { $ref: '#/components/schemas/PlanStage' } } } }
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/PlanStage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/plans/{planId}/stages/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/PlanId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [plans]
      operationId: updatePlanStage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlanStageRequest' }
      responses:
        '200': { description: 修改后阶段, content: { application/json: { schema: { $ref: '#/components/schemas/PlanStage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [plans]
      operationId: deletePlanStage
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { $ref: '#/components/schemas/PlanStage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/plans/{planId}/milestones:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/PlanId'
    post:
      tags: [plans]
      operationId: createMilestone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMilestoneRequest' }
      responses:
        '200': { description: 同 id 已存在, content: { application/json: { schema: { $ref: '#/components/schemas/Milestone' } } } }
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Milestone' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/plans/{planId}/milestones/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/PlanId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [plans]
      operationId: updateMilestone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMilestoneRequest' }
      responses:
        '200': { description: 修改后里程碑, content: { application/json: { schema: { $ref: '#/components/schemas/Milestone' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [plans]
      operationId: deleteMilestone
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { $ref: '#/components/schemas/Milestone' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/plans/{planId}/logs:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/PlanId'
    post:
      tags: [plans]
      operationId: createPlanLog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlanLogRequest' }
      responses:
        '200': { description: 同 id 已存在, content: { application/json: { schema: { $ref: '#/components/schemas/PlanLog' } } } }
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/PlanLog' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /rooms/{roomId}/plans/{planId}/complete:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/PlanId'
    post:
      tags: [plans]
      operationId: completePlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletePlanRequest' }
      responses:
        '200': { description: 已完成的计划, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── AI ─────────────────────────
  /rooms/{roomId}/ai/chat:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [ai]
      operationId: askAiInChat
      summary: 问 AI（聊天里）
      description: |
        只在用户明确点「问 AI」时调用；不进离线发件箱。服务端带上最近的聊天内容作为上下文，
        回答写成一条 `kind = ai`、`id = jobId` 的消息（`aiPrompt` 为提问）。
        同一 `jobId` 再次请求：失败的重新排队，其余返回当前状态。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiChatRequest' }
      responses:
        '202':
          description: 已接受
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiJobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/AiQuotaExceeded' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /rooms/{roomId}/ai/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: jobId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [ai]
      operationId: getAiJob
      summary: 查询 AI 任务状态
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/ai-usage:
    get:
      tags: [ai]
      operationId: getMyAiUsage
      summary: 我发起的 AI 使用
      parameters:
        - name: month
          in: query
          description: 形如 2026-09；不传为本月（UTC）
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
      responses:
        '200':
          description: 某月我发起的 AI 调用与本月额度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiUsage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── 推送设备 ─────────────────────────
  /devices:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: 注册推送设备
      description: 同一 `provider + token` 已存在时更新为当前用户和当前登录，返回 200。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceRequest' }
      responses:
        '200':
          description: 已存在，已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '201':
          description: 已注册
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [devices]
      operationId: unregisterDevice
      summary: 注销推送设备
      responses:
        '204':
          description: 已注销
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 访问令牌 15 分钟过期；收到 401 时客户端自动刷新一次再重试。

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: 上一页响应里的 `nextCursor`，原样传回
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }

  responses:
    BadRequest:
      description: 参数不合法（`invalid_request`，`errors` 列出字段）或邀请码无效（`invite_invalid`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: 未登录、令牌过期或无效、用户名或密码不正确（`unauthorized`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 已登录但无权做这件事（`forbidden`），或注册已关闭（`registration_closed`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 资源不存在，或你不是该房间成员（`not_found`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 冲突（`conflict_id`、`room_full`、`username_taken`、`conflict_version`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: 超过大小限制（`payload_too_large`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: 文件类型不支持（`unsupported_media_type`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AiQuotaExceeded:
      description: 本月 AI 额度用完（`ai_quota_exceeded`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AiUnavailable:
      description: AI 服务未配置或暂时不可用（`ai_unavailable`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: 请求太频繁（`rate_limited`）
      headers:
        Retry-After:
          description: 多少秒后可以重试
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MoodCreated:
      description: 已创建
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Mood' }
    MoodExisting:
      description: 同 id 已存在，返回已有对象
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Mood' }
    MoodOk:
      description: 心情
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Mood' }
    TodoCreated:
      description: 已创建
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Todo' }
    TodoExisting:
      description: 同 id 已存在，返回已有对象
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Todo' }
    TodoOk:
      description: 待办
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Todo' }
    EventCreated:
      description: 已创建
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Event' }
    EventExisting:
      description: 同 id 已存在，返回已有对象
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Event' }
    EventOk:
      description: 日程
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Event' }
    MessageCreated:
      description: 已创建
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    MessageExisting:
      description: 同 id 已存在，返回已有对象
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    MessageOk:
      description: 消息
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }

  schemas:
    # ── 基础类型 ──
    Uuid:
      type: string
      format: uuid
      description: UUIDv7
    NullableUuid:
      type: [string, 'null']
      format: uuid
    Instant:
      type: string
      format: date-time
      description: ISO-8601 UTC，如 `2026-09-21T11:30:00Z`
    NullableInstant:
      type: [string, 'null']
      format: date-time
    LocalDate:
      type: string
      format: date
      description: 纯日期，如 `2026-09-21`
    NullableLocalDate:
      type: [string, 'null']
      format: date

    # ── 错误 ──
    ProblemCode:
      type: string
      enum:
        - invalid_request
        - unauthorized
        - forbidden
        - not_found
        - conflict_version
        - conflict_id
        - room_full
        - username_taken
        - invite_invalid
        - registration_closed
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - ai_unavailable
        - ai_quota_exceeded
        - internal_error
    Problem:
      type: object
      description: RFC 9457 problem+json
      required: [type, title, status, code]
      properties:
        type: { type: string, example: 'https://qichi.app/errors/room_full' }
        title: { type: string, description: 给人看的中文标题；客户端不要据此判断 }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ProblemCode' }
        detail: { type: string }
        errors:
          type: array
          description: 仅 `invalid_request`
          items: { $ref: '#/components/schemas/FieldError' }
        latestVersion:
          type: integer
          description: 仅 `conflict_version`
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: intensity }
        message: { type: string, example: 强度必须在 1 到 10 之间 }

    # ── 系统 ──
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, const: ok }
        version: { type: string, example: 0.1.0 }

    CalendarImportResult:
      type: object
      required: [imported, skipped]
      properties:
        imported: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
    CalendarSubscriptionRequest:
      type: object
      required: [reset]
      properties:
        reset: { type: boolean, default: false }
    CalendarSubscription:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, description: 令牌即凭证，请勿写入日志 }

    # ── 账号 ──
    Username:
      type: string
      pattern: '^[a-z0-9_]{3,32}$'
      description: 3–32 位小写字母、数字、下划线
    Password:
      type: string
      minLength: 8
      maxLength: 128
    DisplayName:
      type: string
      minLength: 1
      maxLength: 32
    RegisterRequest:
      type: object
      required: [username, password, displayName]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password: { $ref: '#/components/schemas/Password' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        inviteCode:
          type: string
          pattern: '^[A-Z2-9]{8}$'
          description: 第一个账号之后必填
        deviceName:
          type: string
          maxLength: 64
          description: 如 `Pixel 9`，显示在「安全 → 登录设备」
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 32 }
        password: { type: string, minLength: 1, maxLength: 128 }
        deviceName: { type: string, maxLength: 64 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LoginSession:
      type: object
      required: [id, deviceName, createdAt, lastUsedAt, current]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        deviceName: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Instant' }
        lastUsedAt: { $ref: '#/components/schemas/Instant' }
        current: { type: boolean, description: 就是发出这次请求的设备 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { $ref: '#/components/schemas/Password' }
    AuthTokens:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken: { type: string, description: JWT，15 分钟 }
        accessTokenExpiresAt: { $ref: '#/components/schemas/Instant' }
        refreshToken: { type: string, description: 不透明随机串，60 天，每次使用都轮换 }
        refreshTokenExpiresAt: { $ref: '#/components/schemas/Instant' }

    # ── 当前用户 ──
    User:
      type: object
      required: [id, username, displayName, avatarFileId, notificationPrefs, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        username: { $ref: '#/components/schemas/Username' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        avatarFileId: { $ref: '#/components/schemas/NullableUuid' }
        notificationPrefs: { $ref: '#/components/schemas/NotificationPrefs' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        aiPrefs: { $ref: '#/components/schemas/AiPrefs' }
    NotificationPrefs:
      type: object
      description: 通知偏好。具体字段在 P3-10（推送）确定；在那之前是空对象。
      additionalProperties: true
    AiPrefs:
      type: object
      description: |
        AI 能看到哪些房间资料（每人一份，对自己发起的 AI 请求生效；自动生成的年度回顾按两个人都允许的来）。
        缺的字段按 true（默认都能看）。`chat` 指更早的聊天：问 AI 时总会带上最近的几十条聊天。
      properties:
        archive: { type: boolean, default: true }
        decisions: { type: boolean, default: true }
        plans: { type: boolean, default: true }
        events: { type: boolean, default: true }
        todos: { type: boolean, default: true }
        ideas: { type: boolean, default: true }
        chat: { type: boolean, default: true }
        moods: { type: boolean, default: true }
    MyRoom:
      type: object
      required: [roomId, name, role]
      properties:
        roomId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        role: { $ref: '#/components/schemas/MemberRole' }
    Me:
      type: object
      required: [user, rooms, aiEnabled]
      properties:
        user: { $ref: '#/components/schemas/User' }
        rooms:
          type: array
          items: { $ref: '#/components/schemas/MyRoom' }
        aiEnabled:
          type: boolean
          description: 服务端配置了 AI；否则 App 里的 AI 按钮显示为不可用
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        displayName: { $ref: '#/components/schemas/DisplayName' }
        avatarFileId: { $ref: '#/components/schemas/NullableUuid' }
        notificationPrefs: { $ref: '#/components/schemas/NotificationPrefs' }
        aiPrefs: { $ref: '#/components/schemas/AiPrefs' }

    # ── 同步实体的公共字段 ──
    SyncFields:
      type: object
      required: [id, roomId, seq, createdAt, updatedAt, deletedAt, deletedBy]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        roomId: { $ref: '#/components/schemas/Uuid' }
        seq:
          type: integer
          format: int64
          description: 这个实体最后一次变化时分配的房间序号
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
        deletedAt:
          $ref: '#/components/schemas/NullableInstant'
          description: 不为空表示在回收站里
        deletedBy: { $ref: '#/components/schemas/NullableUuid' }

    # ── 房间 ──
    MemberRole:
      type: string
      enum: [owner, member]
    Room:
      type: object
      description: 同步实体类型 `room`（房间没有删除，`deletedAt` 始终为空）
      required: [id, name, avatarFileId, heroFileId, anniversary, timezone, createdBy, seq, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 40 }
        avatarFileId: { $ref: '#/components/schemas/NullableUuid' }
        heroFileId:
          $ref: '#/components/schemas/NullableUuid'
          description: 今天页主视觉照片；为空时显示雾海插画
        anniversary: { $ref: '#/components/schemas/NullableLocalDate' }
        timezone: { type: string, example: Asia/Shanghai, description: IANA 时区名；「今天」「本周」按它计算 }
        createdBy:
          $ref: '#/components/schemas/Uuid'
          description: 创建者用 personA 的颜色，另一位用 personB
        seq: { type: integer, format: int64 }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    Member:
      description: 同步实体类型 `member`
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [userId, role, username, displayName, avatarFileId, joinedAt]
          properties:
            userId: { $ref: '#/components/schemas/Uuid' }
            role: { $ref: '#/components/schemas/MemberRole' }
            username: { $ref: '#/components/schemas/Username' }
            displayName: { $ref: '#/components/schemas/DisplayName' }
            avatarFileId: { $ref: '#/components/schemas/NullableUuid' }
            joinedAt: { $ref: '#/components/schemas/Instant' }
    RoomDetail:
      type: object
      required: [room, members, lastSeq]
      properties:
        room: { $ref: '#/components/schemas/Room' }
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        lastSeq: { type: integer, format: int64 }
    CreateRoomRequest:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 40 }
        timezone: { type: string, default: Asia/Shanghai }
        anniversary: { $ref: '#/components/schemas/LocalDate' }
    UpdateRoomRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        avatarFileId: { $ref: '#/components/schemas/NullableUuid' }
        heroFileId: { $ref: '#/components/schemas/NullableUuid' }
        anniversary: { $ref: '#/components/schemas/NullableLocalDate' }
        timezone: { type: string }
    Invite:
      type: object
      required: [code, roomId, expiresAt, createdAt]
      properties:
        code: { type: string, pattern: '^[A-Z2-9]{8}$', example: K7PQ2XRM }
        roomId: { $ref: '#/components/schemas/Uuid' }
        expiresAt: { $ref: '#/components/schemas/Instant' }
        createdAt: { $ref: '#/components/schemas/Instant' }
    AcceptInviteRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[A-Z2-9]{8}$' }

    # ── 同步 ──
    EntityType:
      type: string
      description: 与 `shared/model/EntityType` 一致，后续阶段追加
      enum: [room, member, message, read_marker, mood, mood_response, todo, event, question, qna_round, answer, plan, plan_stage, milestone, plan_log, idea, document, board_topic, board_post, board_reaction, archive_item, decision, book, reading_progress, highlight, summary, review_document, review_version, annotation, annotation_reply, ai_finding, ai_action, doc_comment]
    ChangeOp:
      type: string
      description: '`upsert` 包括软删除与恢复；只有彻底删除是 `delete`'
      enum: [upsert, delete]
    Change:
      type: object
      required: [seq, type, id, op, data]
      properties:
        seq: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/EntityType' }
        id: { $ref: '#/components/schemas/Uuid' }
        op: { $ref: '#/components/schemas/ChangeOp' }
        data:
          description: |
            实体的完整当前状态，结构由 `type` 决定：
            room → Room，member → Member，message → Message，read_marker → ReadMarker，
            mood → Mood，mood_response → MoodReply，todo → Todo，event → Event，
            question → Question，qna_round → QnaRound，answer → Answer，
            plan → Plan，plan_stage → PlanStage，milestone → Milestone，plan_log → PlanLog。
            `op = delete` 时为 `null`。
          oneOf:
            - $ref: '#/components/schemas/Room'
            - $ref: '#/components/schemas/Member'
            - $ref: '#/components/schemas/Message'
            - $ref: '#/components/schemas/ReadMarker'
            - $ref: '#/components/schemas/Mood'
            - $ref: '#/components/schemas/MoodReply'
            - $ref: '#/components/schemas/Todo'
            - $ref: '#/components/schemas/Event'
            - $ref: '#/components/schemas/Question'
            - $ref: '#/components/schemas/QnaRound'
            - $ref: '#/components/schemas/Answer'
            - $ref: '#/components/schemas/Plan'
            - $ref: '#/components/schemas/PlanStage'
            - $ref: '#/components/schemas/Milestone'
            - $ref: '#/components/schemas/PlanLog'
            - $ref: '#/components/schemas/Idea'
            - $ref: '#/components/schemas/Document'
            - $ref: '#/components/schemas/BoardTopic'
            - $ref: '#/components/schemas/BoardPost'
            - $ref: '#/components/schemas/BoardReaction'
            - $ref: '#/components/schemas/ArchiveItem'
            - $ref: '#/components/schemas/Decision'
            - $ref: '#/components/schemas/Book'
            - $ref: '#/components/schemas/ReadingProgress'
            - $ref: '#/components/schemas/Highlight'
            - $ref: '#/components/schemas/Summary'
            - $ref: '#/components/schemas/ReviewDocument'
            - $ref: '#/components/schemas/ReviewVersion'
            - $ref: '#/components/schemas/Annotation'
            - $ref: '#/components/schemas/AnnotationReply'
            - $ref: '#/components/schemas/AiFinding'
            - $ref: '#/components/schemas/AiAction'
            - $ref: '#/components/schemas/DocComment'
            - type: 'null'
    SyncResponse:
      type: object
      required: [fromSeq, toSeq, hasMore, changes]
      properties:
        fromSeq: { type: integer, format: int64, description: 等于请求的 `since` }
        toSeq: { type: integer, format: int64, description: 下次请求用它作为 `since` }
        hasMore: { type: boolean }
        changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }
    Bootstrap:
      type: object
      required: [room, members, lastSeq, readMarker, moods, moodReplies, todos, events, messages, hasMoreMessages, questions, qnaRounds, answers, plans, planStages, milestones, planLogs, ideas, documents, boardTopics, boardPosts, boardReactions, archiveItems, decisions, books, readingProgress, highlights, summaries, reviewDocuments, reviewVersions, annotations, annotationReplies, aiFindings, aiActions, docComments]
      properties:
        room: { $ref: '#/components/schemas/Room' }
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        lastSeq: { type: integer, format: int64 }
        readMarker:
          description: 自己的未读位置；从未推进过时为 `null`
          oneOf:
            - $ref: '#/components/schemas/ReadMarker'
            - type: 'null'
        moods:
          type: array
          items: { $ref: '#/components/schemas/Mood' }
        moodReplies:
          type: array
          items: { $ref: '#/components/schemas/MoodReply' }
        todos:
          type: array
          items: { $ref: '#/components/schemas/Todo' }
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        messages:
          type: array
          description: 最近 50 条消息，按 `createdSeq` 降序
          items: { $ref: '#/components/schemas/Message' }
        hasMoreMessages: { type: boolean }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        qnaRounds:
          type: array
          items: { $ref: '#/components/schemas/QnaRound' }
        answers:
          type: array
          description: 只含自己的答案及已揭晓的对方答案
          items: { $ref: '#/components/schemas/Answer' }
        plans: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        planStages: { type: array, items: { $ref: '#/components/schemas/PlanStage' } }
        milestones: { type: array, items: { $ref: '#/components/schemas/Milestone' } }
        planLogs: { type: array, items: { $ref: '#/components/schemas/PlanLog' } }
        ideas: { type: array, items: { $ref: '#/components/schemas/Idea' } }
        documents: { type: array, items: { $ref: '#/components/schemas/Document' } }
        boardTopics: { type: array, items: { $ref: '#/components/schemas/BoardTopic' } }
        boardPosts: { type: array, items: { $ref: '#/components/schemas/BoardPost' } }
        boardReactions: { type: array, items: { $ref: '#/components/schemas/BoardReaction' } }
        archiveItems: { type: array, items: { $ref: '#/components/schemas/ArchiveItem' } }
        decisions: { type: array, items: { $ref: '#/components/schemas/Decision' } }
        books: { type: array, items: { $ref: '#/components/schemas/Book' } }
        readingProgress: { type: array, items: { $ref: '#/components/schemas/ReadingProgress' } }
        highlights: { type: array, items: { $ref: '#/components/schemas/Highlight' }, description: 自己的全部，加上对方共享的 }
        summaries: { type: array, items: { $ref: '#/components/schemas/Summary' } }
        reviewDocuments: { type: array, items: { $ref: '#/components/schemas/ReviewDocument' } }
        reviewVersions: { type: array, items: { $ref: '#/components/schemas/ReviewVersion' } }
        annotations: { type: array, items: { $ref: '#/components/schemas/Annotation' } }
        annotationReplies: { type: array, items: { $ref: '#/components/schemas/AnnotationReply' } }
        aiFindings: { type: array, items: { $ref: '#/components/schemas/AiFinding' } }
        aiActions: { type: array, items: { $ref: '#/components/schemas/AiAction' } }
        docComments: { type: array, items: { $ref: '#/components/schemas/DocComment' } }
    WsHello:
      type: object
      required: [type, userId, rooms]
      properties:
        type: { type: string, const: hello }
        userId: { $ref: '#/components/schemas/Uuid' }
        rooms:
          type: array
          items:
            type: object
            required: [roomId, lastSeq]
            properties:
              roomId: { $ref: '#/components/schemas/Uuid' }
              lastSeq: { type: integer, format: int64 }
    WsChanged:
      type: object
      required: [type, roomId, seq]
      properties:
        type: { type: string, const: changed }
        roomId: { $ref: '#/components/schemas/Uuid' }
        seq: { type: integer, format: int64 }
    WsAiDone:
      type: object
      description: 第 4 阶段启用
      required: [type, roomId, jobId, status]
      properties:
        type: { type: string, const: ai.done }
        roomId: { $ref: '#/components/schemas/Uuid' }
        jobId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [done, failed] }
    WsAiDelta:
      type: object
      description: |
        问 AI 边生成边显示（P8-03）：text 是到目前为止给人看的回答全文（不是增量，不含动作段和引用编号）；
        最终回答仍是 id = jobId 的 AI 消息。只发给连接地址带 `?caps=ai_stream` 的连接。
      required: [type, roomId, jobId, text]
      properties:
        type: { type: string, const: ai.delta }
        roomId: { $ref: '#/components/schemas/Uuid' }
        jobId: { $ref: '#/components/schemas/Uuid' }
        text: { type: string }

    # ── 心情 ──
    MoodLabel:
      type: string
      description: calm 平静 · happy 开心 · hopeful 期待 · tired 疲惫 · anxious 焦虑 · down 低落 · angry 生气 · hurt 委屈
      enum: [calm, happy, hopeful, tired, anxious, down, angry, hurt]
    MoodReplyKind:
      type: string
      description: here 我在这里 · hug 给你一个拥抱 · ready 等你准备好
      enum: [here, hug, ready]
    Mood:
      description: 同步实体类型 `mood`
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [authorId, label, intensity, note, needsComfort]
          properties:
            authorId: { $ref: '#/components/schemas/Uuid' }
            label: { $ref: '#/components/schemas/MoodLabel' }
            intensity: { type: integer, minimum: 1, maximum: 10 }
            note: { type: [string, 'null'], maxLength: 500 }
            needsComfort: { type: boolean }
    CreateMoodRequest:
      type: object
      required: [id, label, intensity]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        label: { $ref: '#/components/schemas/MoodLabel' }
        intensity: { type: integer, minimum: 1, maximum: 10 }
        note: { type: string, maxLength: 500 }
        needsComfort: { type: boolean, default: false }
    MoodReply:
      description: 同步实体类型 `mood_response`；收回 = 软删除
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [moodId, authorId, kind]
          properties:
            moodId: { $ref: '#/components/schemas/Uuid' }
            authorId: { $ref: '#/components/schemas/Uuid' }
            kind: { $ref: '#/components/schemas/MoodReplyKind' }
    CreateMoodReplyRequest:
      type: object
      required: [id, kind]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/MoodReplyKind' }

    # ── 待办 ──
    Todo:
      description: 同步实体类型 `todo`
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [title, note, createdBy, assigneeId, parentId, dueDate, dueAt, recurrence, recurrencePrevId, doneAt, doneBy]
          properties:
            title: { type: string, minLength: 1, maxLength: 200 }
            note: { type: [string, 'null'], maxLength: 2000 }
            createdBy: { $ref: '#/components/schemas/Uuid' }
            assigneeId:
              $ref: '#/components/schemas/NullableUuid'
              description: 为空 = 两个人
            parentId:
              $ref: '#/components/schemas/NullableUuid'
              description: 不为空 = 子任务
            dueDate:
              $ref: '#/components/schemas/NullableLocalDate'
              description: 只有日期的截止（按房间时区）；与 `dueAt` 至多一个有值
            dueAt: { $ref: '#/components/schemas/NullableInstant' }
            recurrence:
              type: [string, 'null']
              example: FREQ=WEEKLY;INTERVAL=1;BYDAY=SU
            recurrencePrevId:
              $ref: '#/components/schemas/NullableUuid'
              description: 由哪一条重复待办的完成生成
            doneAt: { $ref: '#/components/schemas/NullableInstant' }
            doneBy: { $ref: '#/components/schemas/NullableUuid' }
    CreateTodoRequest:
      type: object
      required: [id, title]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        note: { type: string, maxLength: 2000 }
        assigneeId: { $ref: '#/components/schemas/NullableUuid' }
        parentId: { $ref: '#/components/schemas/Uuid' }
        dueDate: { $ref: '#/components/schemas/LocalDate' }
        dueAt: { $ref: '#/components/schemas/Instant' }
        recurrence: { type: string, maxLength: 200 }
    UpdateTodoRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 2000 }
        assigneeId: { $ref: '#/components/schemas/NullableUuid' }
        dueDate: { $ref: '#/components/schemas/NullableLocalDate' }
        dueAt: { $ref: '#/components/schemas/NullableInstant' }
        recurrence: { type: [string, 'null'], maxLength: 200 }
    CompleteTodoRequest:
      type: object
      properties:
        nextId:
          $ref: '#/components/schemas/Uuid'
          description: 重复待办必填：下一次实例的 id
    CompleteTodoResponse:
      type: object
      required: [todo, next]
      properties:
        todo: { $ref: '#/components/schemas/Todo' }
        next:
          description: 生成的下一次实例；不是重复待办时为 `null`
          oneOf:
            - $ref: '#/components/schemas/Todo'
            - type: 'null'

    # ── 双人问答 ──
    Question:
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [text, source, createdBy, suggestedByJobId, adoptedBy, adoptedAt]
          properties:
            text: { type: string, minLength: 1, maxLength: 500 }
            source: { $ref: '#/components/schemas/QuestionSource' }
            createdBy: { $ref: '#/components/schemas/NullableUuid' }
            suggestedByJobId: { $ref: '#/components/schemas/NullableUuid' }
            adoptedBy: { $ref: '#/components/schemas/NullableUuid' }
            adoptedAt: { $ref: '#/components/schemas/NullableInstant' }
    QuestionSource:
      type: string
      enum: [ai, user, preset]
    QnaRound:
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [questionId, roundDate, revealedAt, confirmedBy]
          properties:
            questionId: { $ref: '#/components/schemas/Uuid' }
            roundDate: { $ref: '#/components/schemas/LocalDate' }
            revealedAt: { $ref: '#/components/schemas/NullableInstant' }
            confirmedBy:
              type: array
              items: { $ref: '#/components/schemas/Uuid' }
    Answer:
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [roundId, authorId, body, confirmedAt]
          properties:
            roundId: { $ref: '#/components/schemas/Uuid' }
            authorId: { $ref: '#/components/schemas/Uuid' }
            body: { type: string, minLength: 1, maxLength: 10000 }
            confirmedAt: { $ref: '#/components/schemas/NullableInstant' }
    QnaToday:
      type: object
      required: [round, question, myAnswer, partnerAnswer, partnerConfirmed, yesterday, yesterdayQuestion, yesterdayAnswers]
      properties:
        round: { $ref: '#/components/schemas/QnaRound' }
        question: { $ref: '#/components/schemas/Question' }
        myAnswer: { oneOf: [{ $ref: '#/components/schemas/Answer' }, { type: 'null' }] }
        partnerAnswer: { oneOf: [{ $ref: '#/components/schemas/Answer' }, { type: 'null' }] }
        partnerConfirmed: { type: boolean }
        yesterday: { oneOf: [{ $ref: '#/components/schemas/QnaRound' }, { type: 'null' }] }
        yesterdayQuestion: { oneOf: [{ $ref: '#/components/schemas/Question' }, { type: 'null' }] }
        yesterdayAnswers:
          type: array
          items: { $ref: '#/components/schemas/Answer' }
    CreateQuestionRequest:
      type: object
      required: [id, text]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        text: { type: string, minLength: 1, maxLength: 500 }
    WriteAnswerRequest:
      type: object
      required: [id, body]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        body: { type: string, minLength: 1, maxLength: 10000 }
    QuestionSuggestRequest:
      type: object
      required: [jobId]
      properties:
        jobId: { $ref: '#/components/schemas/Uuid' }

    # ── 计划 ──
    PlanStatus:
      type: string
      enum: [active, done, archived]
    Plan:
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [title, ownerId, status, targetDate, nextStep, nextStepOwnerId, nextStepDue, completedAt, completionNote]
          properties:
            title: { type: string, minLength: 1, maxLength: 200 }
            ownerId: { $ref: '#/components/schemas/Uuid' }
            status: { $ref: '#/components/schemas/PlanStatus' }
            targetDate: { $ref: '#/components/schemas/NullableLocalDate' }
            nextStep: { type: [string, 'null'], maxLength: 1000 }
            nextStepOwnerId: { $ref: '#/components/schemas/NullableUuid' }
            nextStepDue: { $ref: '#/components/schemas/NullableLocalDate' }
            completedAt: { $ref: '#/components/schemas/NullableInstant' }
            completionNote: { type: [string, 'null'], maxLength: 10000 }
    PlanStage:
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [planId, title, sortOrder, doneAt]
          properties:
            planId: { $ref: '#/components/schemas/Uuid' }
            title: { type: string, minLength: 1, maxLength: 200 }
            sortOrder: { type: integer, minimum: 0 }
            doneAt: { $ref: '#/components/schemas/NullableInstant' }
    Milestone:
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [planId, title, targetDate, doneAt]
          properties:
            planId: { $ref: '#/components/schemas/Uuid' }
            title: { type: string, minLength: 1, maxLength: 200 }
            targetDate: { $ref: '#/components/schemas/NullableLocalDate' }
            doneAt: { $ref: '#/components/schemas/NullableInstant' }
    PlanLog:
      description: 创建后不可修改的过程记录
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [planId, authorId, body]
          properties:
            planId: { $ref: '#/components/schemas/Uuid' }
            authorId: { $ref: '#/components/schemas/Uuid' }
            body: { type: string, minLength: 1, maxLength: 10000 }
    Idea:
      description: 同步实体类型 `idea`：随手记下的想法（P4）
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [authorId, body]
          properties:
            authorId: { $ref: '#/components/schemas/Uuid' }
            body: { type: string, minLength: 1, maxLength: 2000 }
    CreateIdeaRequest:
      type: object
      required: [id, body]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        body: { type: string, minLength: 1, maxLength: 2000 }
    UpdateIdeaRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    SummaryKind:
      type: string
      enum: [week, month, custom, year]
    SummarySource:
      type: object
