      tags: [reviews]
      operationId: diffReviewVersions
      summary: 两个版本间的文字差异（按文字块对比；两个版本的预览都要已生成）
      responses:
        '200': { description: 差异, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewDiff' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/reviews/{id}/annotations:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [reviews]
      operationId: createAnnotation
      summary: 批注或修改提议（可离线创建，经发件箱补发）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAnnotationRequest' } } }
      responses:
        '200': { description: 同 id 已存在, content: { application/json: { schema: { $ref: '#/components/schemas/Annotation' } } } }
        '201': { description: 已新建, content: { application/json: { schema: { $ref: '#/components/schemas/Annotation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/reviews/{id}/annotations/{annId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
      - { name: annId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    patch:
      tags: [reviews]
      operationId: updateAnnotation
      summary: 改正文（只有作者）或状态（两人都可以：接受、归档、重新打开）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAnnotationRequest' } } }
      responses:
        '200': { description: 修改后的批注, content: { application/json: { schema: { $ref: '#/components/schemas/Annotation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [reviews]
      operationId: deleteAnnotation
      summary: 删掉自己的批注（进回收站）
      responses:
        '200': { description: 删除后的批注, content: { application/json: { schema: { $ref: '#/components/schemas/Annotation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/annotations/{annId}/replies:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - { name: annId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [reviews]
      operationId: createAnnotationReply
      summary: 在批注下面讨论（可离线创建）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAnnotationReplyRequest' } } }
      responses:
        '200': { description: 同 id 已存在, content: { application/json: { schema: { $ref: '#/components/schemas/AnnotationReply' } } } }
        '201': { description: 已新建, content: { application/json: { schema: { $ref: '#/components/schemas/AnnotationReply' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/ai/review-findings:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [reviews, ai]
      operationId: requestReviewFindings
      summary: 本次授权 AI 审这个版本（只发文字层，不发图片）→ 202；结果是若干条 ai_finding，每条都带原文证据和定位
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AiReviewFindingsRequest' } } }
      responses:
        '202': { description: 已排队, content: { application/json: { schema: { $ref: '#/components/schemas/AiJobAccepted' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/AiQuotaExceeded' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /rooms/{roomId}/ai-findings/{id}/convert:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [reviews]
      operationId: convertFinding
      summary: 把 AI 发现转成一条人工批注（作者是自己，钉在第一条证据上）；已经转过的返回那条批注
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConvertFindingRequest' } } }
      responses:
        '200': { description: 已经转过, content: { application/json: { schema: { $ref: '#/components/schemas/Annotation' } } } }
        '201': { description: 已转为批注, content: { application/json: { schema: { $ref: '#/components/schemas/Annotation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/ai-findings/{id}/dismiss:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [reviews]
      operationId: dismissFinding
      summary: 忽略这条 AI 发现
      responses:
        '200': { description: 忽略后的发现, content: { application/json: { schema: { $ref: '#/components/schemas/AiFinding' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/ai-actions/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [ai]
      operationId: acceptAiAction
      summary: 接受 AI 的提议（P8-02）：服务端按草稿建成日程 / 待办 / 档案 / 灵感（id = resultId）；已经接受过的原样返回
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcceptAiActionRequest' } } }
      responses:
        '200': { description: 接受后的动作（建成的实体经同步到达）, content: { application/json: { schema: { $ref: '#/components/schemas/AiAction' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/ai-actions/{id}/dismiss:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [ai]
      operationId: dismissAiAction
      summary: 不用这个提议（已经接受的不变）
      responses:
        '200': { description: 之后的动作, content: { application/json: { schema: { $ref: '#/components/schemas/AiAction' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /app/latest:
    get:
      tags: [system]
      operationId: latestAppRelease
      summary: App 的最新版本（内置更新用）；还没发布过时 404
      responses:
        '200': { description: 最新版本, content: { application/json: { schema: { $ref: '#/components/schemas/AppRelease' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /app/apk:
    get:
      tags: [system]
      operationId: downloadAppApk
      summary: 下载最新版本的安装包（下载后核对 sha256）
      responses:
        '200':
          description: 安装包
          content:
            application/vnd.android.package-archive:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/timeline:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [timeline]
      operationId: getTimeline
      summary: 某个月的时间线（不带年月时取最近一个有内容的月份；没有内容时是本月）
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
        - { name: month, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200': { description: 一个月, content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/on-this-day:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [timeline]
      operationId: getOnThisDay
      summary: 某一天（房间时区）聊天里发过的照片，「一年前的今天」用（最多 12 张）
      parameters:
        - { name: date, in: query, required: true, schema: { $ref: '#/components/schemas/LocalDate' } }
      responses:
        '200': { description: 那一天, content: { application/json: { schema: { $ref: '#/components/schemas/OnThisDay' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/timeline/picks:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [timeline]
      operationId: listTimelinePicks
      summary: 两个人各自选中的照片
      responses:
        '200':
          description: 选中记录
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TimelinePick' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/timeline/picks/{fileId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: fileId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    put:
      tags: [timeline]
      operationId: pickTimelinePhoto
      summary: 选中一张照片（必须是这个房间里的图片；重复选中不报错）
      responses:
        '204': { description: 已选中 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [timeline]
      operationId: unpickTimelinePhoto
      summary: 取消选中（本来没选也不报错）
      responses:
        '204': { description: 已取消 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/decisions:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [decisions]
      operationId: listDecisions
      summary: 决定列表（没定的在前，其余按定下的时间；不含已删除的）
      responses:
        '200':
          description: 决定
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Decision' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [decisions]
      operationId: createDecision
      summary: 新的决定
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDecisionRequest' } } }
      responses:
        '200': { description: 同 id 已存在, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/decisions/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [decisions]
      operationId: updateDecision
      summary: 修改（只发改动的字段；关注点只能改自己的）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateDecisionRequest' } } }
      responses:
        '200': { description: 修改后的决定, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [decisions]
      operationId: deleteDecision
      summary: 删除进回收站（两位成员都可以）
      responses:
        '200': { description: 删除后的决定, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/archive:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [archive]
      operationId: listArchive
      summary: 档案条目（最近修订的在前，不含已删除的）
      responses:
        '200':
          description: 条目
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ArchiveItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [archive]
      operationId: createArchiveItem
      summary: 新条目（同时产生第 1 次修订）；可以带来源消息
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateArchiveItemRequest' } } }
      responses:
        '200': { description: 同 id 已存在, content: { application/json: { schema: { $ref: '#/components/schemas/ArchiveItem' } } } }
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/ArchiveItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/archive/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [archive]
      operationId: deleteArchiveItem
      summary: 删除条目进回收站（两位成员都可以；修订历史随它保留）
      responses:
        '200': { description: 删除后的条目, content: { application/json: { schema: { $ref: '#/components/schemas/ArchiveItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/archive/{id}/revisions:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    get:
      tags: [archive]
      operationId: listArchiveRevisions
      summary: 历次修订（修订号从大到小，含当前这次）
      responses:
        '200':
          description: 修订
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ArchiveRevision' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [archive]
      operationId: reviseArchiveItem
      summary: 新修订
      description: 带 `baseRevision`；不是当前修订号 → 409 `conflict_version`，`latestVersion` 是当前修订号。同一个修订 `id` 重试返回修订后的条目（200）。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReviseArchiveItemRequest' } } }
      responses:
        '200': { description: 同一次修订重试, content: { application/json: { schema: { $ref: '#/components/schemas/ArchiveItem' } } } }
        '201': { description: 修订后的条目, content: { application/json: { schema: { $ref: '#/components/schemas/ArchiveItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/board/topics:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [board]
      operationId: listBoardTopics
      summary: 主题列表（置顶的在前，其余按最近留言；不含已删除的）
      responses:
        '200':
          description: 主题
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BoardTopic' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [board]
      operationId: createBoardTopic
      summary: 新建主题（第一条留言另外发）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateBoardTopicRequest' } } }
      responses:
        '200': { description: 同 id 已存在, content: { application/json: { schema: { $ref: '#/components/schemas/BoardTopic' } } } }
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/BoardTopic' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/board/topics/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [board]
      operationId: updateBoardTopic
      summary: 改标题、置顶或取消置顶（两位成员都可以）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBoardTopicRequest' } } }
      responses:
        '200': { description: 修改后的主题, content: { application/json: { schema: { $ref: '#/components/schemas/BoardTopic' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [board]
      operationId: deleteBoardTopic
      summary: 删除主题进回收站（主题下的留言随它隐藏；彻底删除时一起删掉）
      responses:
        '200': { description: 删除后的主题, content: { application/json: { schema: { $ref: '#/components/schemas/BoardTopic' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/board/topics/{topicId}/posts:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: topicId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [board]
      operationId: createBoardPost
      summary: 发一条留言（可引用同一房间里的另一条留言；摘录由服务端生成）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateBoardPostRequest' } } }
      responses:
        '200': { description: 同 id 已存在, content: { application/json: { schema: { $ref: '#/components/schemas/BoardPost' } } } }
        '201': { description: 已发出, content: { application/json: { schema: { $ref: '#/components/schemas/BoardPost' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/board/posts/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [board]
      operationId: reviseBoardPost
      summary: 修订留言（仅作者）
